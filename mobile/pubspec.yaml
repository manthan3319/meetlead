name: meetlead
description: MeetLead Pro — Meeting & Lead Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  go_router: ^14.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  awesome_notifications: ^0.9.3+1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
